# En cada push y pull request: el sitio tiene que compilar y no tener
# dependencias con vulnerabilidades altas.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependencias sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
